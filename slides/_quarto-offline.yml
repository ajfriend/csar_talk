# `quarto render --profile offline` (what `just vendor` runs): the same deck
# with every network fetch pointed at slides/vendor/, which `just vendor`
# fills. The import map (offline.html) remaps the CDN bases the JS modules
# import from and import.meta.resolve() through, so no rendered file is
# edited; MathJax is Quarto's own option. The default render is untouched.
project:
  resources:
    - web
    - data
    - vendor
format:
  revealjs:
    html-math-method:
      method: mathjax
      url: vendor/mathjax/tex-chtml-full.js
    include-in-header:
      - mathjax-macros.html
      - offline.html
