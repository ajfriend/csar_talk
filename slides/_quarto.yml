project:
  type: default
  output-dir: _site
  render:
    - talk.qmd
  resources:
    - web
    - data
    - vendor
format:
  revealjs:
    # Every network fetch is served from slides/vendor/ (filled by `just
    # render`): MathJax here, the demo library and coastlines through the
    # import map in importmap.html. One build, online or off.
    html-math-method:
      method: mathjax  # https://github.com/quarto-dev/quarto-cli/discussions/3127
      url: vendor/mathjax/tex-chtml-full.js
    css: style.css
    output-file: index.html
    include-in-header:
      - mathjax-macros.html
      - importmap.html
    include-after-body: cellslides.html
    slide-number: true
    preload-iframes: true
