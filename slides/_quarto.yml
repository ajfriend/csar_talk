project:
  type: default
  output-dir: _site
  render:
    - talk.qmd
  resources:
    - web
    - data
format:
  revealjs:
    html-math-method: mathjax  # https://github.com/quarto-dev/quarto-cli/discussions/3127
    css: style.css
    output-file: index.html
    include-in-header: mathjax-macros.html
    include-after-body: cellslides.html
    slide-number: true
    preload-iframes: true
